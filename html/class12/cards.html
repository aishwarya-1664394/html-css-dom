<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding:0px;
            margin:0px;
            box-sizing: border-box;

        }
        body{
            display:flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;;
            align-items: center;
        }
        .container{
            display: flex;
            width: 90%;
            gap: 20px;
            height: 90%;
            justify-content: center;

        }
        .panel{
            border-radius: 20px;
            object-fit: cover;
            flex: 0.5;
            position: relative;
            background-position: cover;
            background-size:cover;
            transition: flex 1s ease 0.5s;

        }
        .panel.active{
            flex: 8;
        }
        .panel .img-text{
            opacity: 0;
            position:absolute;
            left: 0;
            bottom: 0;
            color: white;
        }
        .active .img-text{
            opacity: 1;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="panel active" id="panel-1" style="background-image: url(https://images.unsplash.com/photo-1558979158-65a1eaa08691?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1350&q=80);">
            <h3 class="img-text">Explore the world</h3>
        </div>
        <div class="panel"id="panel-2" style="background-image: url('NANI2171.JPG');">
            <h3 class="img-text">Wild Forest</h3>
        </div>
        <div class="panel" id="panel-3" style="background-image: url(https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1353&q=80);">
            <h3 class="img-text">City on Winter</h3>
        </div>
        <div class="panel" id="panel-4" style="background-image: url(https://images.unsplash.com/photo-1551009175-8a68da93d5f9?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1351&q=80);">
            <h3 class="img-text">Mountain Cloud</h3>
        </div>
        <div class="panel" id="panel-5" style="background-image: url(https://images.unsplash.com/photo-1549880338-65ddcdfd017b?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1350&q=80);">
            <h3 class="img-text">Sunny Beach</h3>
        </div>
    </div>
    <script>
        let cards=document.querySelectorAll(".panel");
        cards.forEach((card)=>{
            card.addEventListener("click",(e)=>{
                cards.forEach((c)=>{
                    c.classList.remove("active")
                })
                e.target.classList.add("active")
            })

        })

    </script>

</body>
</html>
