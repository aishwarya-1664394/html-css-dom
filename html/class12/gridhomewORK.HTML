<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            padding:0px;
            width:100vw;
            height:100vh;
        }
        .cont{
            display:flex;
            width:100%;
            height:100%;
            border: 2px solid black;
        }
         .aside{
            height:100%;
            width: 30%;
            border: 2px solid blue;
            display:flex;
            flex-direction: column;
           
            
         }
         .user{
            width:100%;
            height:50px;
            border: 1px solid black;
           display:flex;
           justify-content: flex-start;
           gap:20px;
           align-items: center;
            border-radius: 2px;

         }
         .circle{
            height:30px;
            width:30px;
            border-radius: 50%;
            border: 2px solid black;
            background-color:pink ;
         }
    </style>
</head>
<body>
    <div class="cont">
        <div class="aside">
            <div class="user">
                <div class="circle"></div>
                <div class="text">user1</div>
            </div>
            <div class="user">
                 <div class="circle"></div>
                <div class="text">user2</div>
            </div>
            <div class="user">
                 <div class="circle"></div>
                <div class="text">user3</div>
            </div>
        </div>
        <div class="main"></div>
    </div>
</body>
</html>
