<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle{
            height:300px;
            width: 300px;
            border-radius: 50%;
            border: 2px solid salmon;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .sec{
            height:150px;
            width: 150px;
            border-radius: 50%;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .third{
            height:75px;
            width: 75px;
            border-radius: 50%;
            border: 2px solid pink;
        }
    </style>
</head>
<body>
    <div class="circle">
        <div class="sec">
          <div class="third">

          </div>
        </div>

    </div>
</body>
</html>
