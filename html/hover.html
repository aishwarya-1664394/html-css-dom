<!DOCTYPE html>
<html>
<head>
    <style>
        .circle {
            width: 150px;
            height: 150px;
            background: lightblue;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text {
            display: none;
        }

        .circle:hover .text {
            display: block;
        }
    </style>
</head>
<body>

    <div class="circle">
        <p class="text">Hello World!</p>
    </div>

</body>
</html>
