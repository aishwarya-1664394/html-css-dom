<html lang="en">
<head>

</head>
<body >
    <div id="box"></div>
    <script>
        let body=document.querySelector("body");
        body.style.margin="0px";
        body.style.padding="0px";
        body.style.display="flex";
        body.style.position="relative";
        body.style.top="200px"
        body.style.justifyContent="center";
        body.style.alignItems="center";

        box.style.border="2px solid blue";
        box.style.height="500px";
        box.style.width="500px";
        box.style.display="grid";
        box.style.gridTemplateColumns="repeat(auto-fit, minmax(50px, 1fr))"
        box.style.gap="2px"
        box.style.backgroundColor="black"
        let newBox;
        
        for(let i=0;i<=100;i++){
            newBox=document.createElement("div");
            box.appendChild(newBox);
            newBox.id="newBox"
            newBox.style.border="2px solid black";
            newBox.style.backgroundColor="grey";
            newBox.style.borderRadius="10px";
        }
    let b1=document.querySelectorAll("#newBox")

        {

                const blue=Math.floor(Math.random()*256);
               b1[i].style.backgroundColor=`rgb(${red},${green},${blue})`;

         }

         })
