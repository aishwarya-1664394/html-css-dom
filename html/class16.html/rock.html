<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
            padding: 0;
            margin: 0;
         }
         .score{
            display: flex;
            background-color: white;
            height: 50px;
            width: 100%;
            align-items: center;
            justify-content: space-evenly;
         }
         #pscore1{
            height: 25px;
            width: 50px;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
         }
         #pscore2{
             height: 25px;
            width: 50px;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
         }
         #comp{
            width: 125px;
            height:20px;
            border: 2px solid black

         }
    </style>
</head>
<body>
     <div class="score">
    player1 score:<div id="pscore1">0</div>
   player2 score: <div id="pscore2">0</div>
  </div>
    <form>
   Player 1:<input type="text"> <br>
   
  comp: <div id="comp"></div>
   <input type="submit" value="submit">
   
   </form>
   <ol id="list">

   </ol>
</body>
<script>
    let game=["rock","paper","scissor"];
    let player2;
    let ol=document.getElementById("list")
    let history=JSON.parse(localStorage.getItem("history"))|| [];
    let form=document.querySelector("form");
    let player1;
    let p1=document.getElementById("pscore1");
    let p2=document.getElementById("pscore2")
    let body=document.querySelector("body");
    let comp=document.getElementById("comp")
    let p1score=0;
    let p2score=0;
    let p=document.createElement("p");
    body.appendChild(p);
    history.forEach((his)=>{
        addol(his)
    })
   // const local=JSON.parse(localStorage.getItem(local)) || []
    form.addEventListener("submit",(e)=>{
        e.preventDefault()
        player1 = e.target[0].value.trim().toLowerCase();
        console.log("palyer1 ",player1)
        player2=game[Math.floor(Math.random()*3)];
        if(!game.includes(player1)){
            alert("enter only rock or paper or scissor");
            return;
        }
        comp.textContent=player2
        console.log(player2);
        
        if((player1=="rock" && player2=="scissor") || (player1=="scissor" && player2=="rock")){
            if(player1=="rock"){
                
                p.textContent="Player 1 Wins";
                p1score++;
               
            }
            else{
               
                p.textContent="Player 2 Wins";
                p2score++
                
            }
        }
        if((player1=="scissor" && player2=="paper") || (player2=="scissor" && player1=="paper")){
            if(player1=="scissor"){
                
                p.textContent="Player 1 Wins";
                p1score++
               
            }
            else{
                
                p.textContent="Player 2 Wins";
                p2score++;
               
            }
        }
        if((player1=="paper" && player2=="rock") || (player1=="rock" && player2=="paper")){
            if(player1=="paper"){
                
                p.textContent="Player 1 Wins";
                p1score++;
               
            }
            else{
               
                p.textContent="Player 2 Wins";
                p2score++;
              
            }
        }
        if(player1==player2){
            
                p.textContent="Withdraw";
               
        }
        console.log("playerscore1",p1score);
        console.log("playerscore2",p2score);
        let curr={
            player1:e.target[0].value,
            player2: player2,
            player1score: p1score,
            player2score: p2score,
            winner: p.textContent,

        }
        history.push(curr);
        localStorage.setItem("history",JSON.stringify(history))
        addol(curr);
        console.log(curr);
        p1.textContent=String(p1score);
        p2.textContent=String(p2score);
       form.reset();

      
      
    })
    
    function addol(curr){
        let span=document.createElement("span");
         let li=document.createElement("li");
         span.textContent=`
         ${curr.player1} ${curr.player2} ${curr.player1score} ${curr.player2score} ${curr.winner}
         `
         li.append(span);
         ol.append(li)

    }
     
</script>
</html>
